[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bimanual-manipulation"
version = "0.1.0"
description = "Dual-arm Franka manipulation with perception and teleoperation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Sukhvansh Jain", email = "sukhvanshjain@gmail.com"},
]
maintainers = [
    {name = "Sukhvansh Jain", email = "sukhvanshjain@gmail.com"},
]
keywords = ["robotics", "manipulation", "franka", "robosuite", "grasping", "bimanual"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21.0,<2.0.0",
    "scipy>=1.7.0",
    "pydantic>=2.0.0",
    "robosuite>=1.4.0",
    "ultralytics>=8.0.0",  # For FastSAM
    "pynput>=1.7.0",  # For keyboard teleoperation
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "open3d>=0.16.0",
    "matplotlib>=3.5.0",
    "tqdm>=4.62.0",
    "pyyaml>=6.0",
    "pillow>=9.0.0",
    "pyzmq>=25.0.0",  # For ZMQ services
    "opencv-python>=4.5.0",  # For visualization
    "gymnasium",  # For GymWrapper
    "h5py",  # For demonstration utils
    "robosuite-models==1.0.0",  # For extra robosuite_models
    "usd-core",  # For USD export and rendering
    "hydra-core",  # For GraspGen configuration
    "trimesh==4.5.3",  # For mesh processing
    "addict",  # For configuration
    "torch-geometric",  # For graph neural networks
    "yourdfpy==0.0.56",  # For URDF processing
    "mink>=1.0.0",  # QP-based differential IK for MuJoCo (reactive tracking)
    "EAIK>=1.2.0",  # Analytical closed-form IK for Franka Panda
    "proxsuite",  # Fast QP solver backend (proxqp)
]

[project.urls]
Homepage = "https://github.com/Sukhvansh2004/Dual-Arm-Franka-Control-MTP"
Repository = "https://github.com/Sukhvansh2004/Dual-Arm-Franka-Control-MTP.git"
Issues = "https://github.com/Sukhvansh2004/Dual-Arm-Franka-Control-MTP/issues"
Changelog = "https://github.com/Sukhvansh2004/Dual-Arm-Franka-Control-MTP/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bimanual_manipulation" = ["*.yaml", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]