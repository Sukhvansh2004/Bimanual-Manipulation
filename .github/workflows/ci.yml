name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Project page: type-check, lint and build.
  # ---------------------------------------------------------------------------
  web:
    name: Website (typecheck · lint · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Fast Python checks — no dependencies, so they report in seconds even when
  # the full test job is still installing.
  # ---------------------------------------------------------------------------
  python-checks:
    name: Python (syntax · configs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Byte-compile every source, script and test
        run: python -m compileall -q src scripts tests

      - name: Validate experiment configurations
        run: |
          python - <<'PY'
          import json, pathlib, sys

          problems = []
          configs = sorted(pathlib.Path("experiments").glob("*.json"))
          if not configs:
              sys.exit("no experiment configs found")

          for path in configs:
              try:
                  cfg = json.loads(path.read_text())
              except json.JSONDecodeError as exc:
                  problems.append(f"{path}: {exc}")
                  continue
              for key in ("name", "description", "environment"):
                  if key not in cfg:
                      problems.append(f'{path}: missing "{key}"')

          if problems:
              sys.exit("\n".join(problems))
          print(f"{len(configs)} experiment configs OK")
          PY

  # ---------------------------------------------------------------------------
  # Full pytest suite (536 tests) on a stock CPU-only GitHub runner.
  #
  # Two things make this possible without the GPU environment install.sh builds:
  #
  #   * CPU wheels everywhere. torch/torchvision come from the +cpu index and
  #     torch-scatter/torch-cluster from the matching PyG index; every other
  #     dependency ships a manylinux cp310 wheel, so nothing compiles here.
  #
  #   * A stub for GraspGen's PointNet2 CUDA extension. Importing
  #     `bimanual_manipulation` reaches `grasp_gen.grasp_server`, which needs
  #     `pointnet2_ops`; that is a CUDA build and its JIT fallback needs nvcc.
  #     The suite never invokes a PointNet2 kernel, so .github/ci/stubs supplies
  #     an import-only shim that raises if anything actually calls into it.
  #
  # MuJoCo renders through OSMesa (software), so no GPU and no X server.
  # Verified locally: 536 passed with CUDA_VISIBLE_DEVICES="" and the stub.
  # ---------------------------------------------------------------------------
  pytest:
    name: Test suite (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
      # No GPU on the runner — make that explicit rather than accidental.
      CUDA_VISIBLE_DEVICES: ''
      # ROS 2, if ever present on a runner image, registers launch_testing
      # plugins that are incompatible with this pytest version.
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      # `submodules: recursive` cannot be used here: deps/GraspGenModels is a
      # gitlink in the index with no matching entry in .gitmodules (install.sh
      # clones those weights straight from HuggingFace), and git aborts the
      # whole recursive update with "No url found for submodule path". Check
      # out the two properly registered submodules explicitly instead — the
      # model weights are not needed, since the suite mocks GraspGen inference.
      - uses: actions/checkout@v4

      - name: Check out submodules
        run: git submodule update --init --depth=1 deps/GraspGen deps/YCB_Dataset

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install system libraries for headless MuJoCo/OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libosmesa6 libosmesa6-dev libgl1 libglx-mesa0 libglu1-mesa \
            libglew-dev libglfw3 libegl1 patchelf

      - name: Install PyTorch (CPU build)
        run: |
          python -m pip install --upgrade pip wheel
          pip install torch==2.1.0 torchvision==0.16.0 \
            --index-url https://download.pytorch.org/whl/cpu
          pip install torch-scatter torch-cluster \
            -f https://data.pyg.org/whl/torch-2.1.0+cpu.html
          pip install "numpy>=1.21.0,<2.0.0"

      - name: Install GraspGen (without the CUDA PointNet2 ops)
        run: pip install -e deps/GraspGen

      - name: Install the package
        run: pip install -e ".[dev]"

      - name: Report the environment
        run: |
          python - <<'PY'
          import torch, mujoco, numpy, sys
          print("python  ", sys.version.split()[0])
          print("torch   ", torch.__version__, "cuda:", torch.cuda.is_available())
          print("mujoco  ", mujoco.__version__)
          print("numpy   ", numpy.__version__)
          PY

      - name: Smoke-test headless rendering
        env:
          PYTHONPATH: ${{ github.workspace }}/.github/ci/stubs
        run: |
          python - <<'PY'
          import os
          import mujoco

          model = mujoco.MjModel.from_xml_string(
              "<mujoco><worldbody><light pos='0 0 3'/>"
              "<geom type='sphere' size='.1'/></worldbody></mujoco>"
          )
          data = mujoco.MjData(model)
          mujoco.mj_forward(model, data)
          with mujoco.Renderer(model, 64, 64) as renderer:
              renderer.update_scene(data)
              frame = renderer.render()
          print(f"rendered {frame.shape} via MUJOCO_GL={os.environ['MUJOCO_GL']}")
          PY

      - name: Run pytest
        env:
          # Satisfies GraspGen's `from pointnet2_ops import _ext` on CPU.
          PYTHONPATH: ${{ github.workspace }}/.github/ci/stubs
        run: pytest tests/ -q --no-header --junitxml=pytest-report.xml

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report
          path: pytest-report.xml
